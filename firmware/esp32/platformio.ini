[platformio]
default_envs = freenove_esp32s3

[env:freenove_esp32s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200
extra_scripts = post:tools/merge_flash.py
lib_deps = links2004/WebSockets@2.6.1

[env:freenove_esp32s3_joystick]
extends = env:freenove_esp32s3
build_flags =
    ${env:freenove_esp32s3.build_flags}
    -DARCADE_JOYSTICK=1
